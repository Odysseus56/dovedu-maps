# Our own copy of the satellites' broadcast orbit files for the Taxi Antispoof app: every hour, the last three days' files go
# into the release "orbits", replacing the older copy (.github/orbits.py: IGS/BKG when it answers, else Wuhan University's IGS
# archive, and for today a merge of its stations' hourly files). The app downloads from here first. The release is never
# "Latest", so the maps' catalogue link (releases/latest/download/catalog.json) keeps pointing at the map packs.
name: orbits
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: orbits
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: Fetch the last three days' orbit files
        run: python3 .github/orbits.py
      - name: Replace them in the release "orbits"
        run: |
          set -u
          gh release view orbits >/dev/null 2>&1 || gh release create orbits --latest=false --title "Satellite orbits (hourly copy)" \
            --notes "The last three days' daily broadcast orbit files (RINEX navigation, mixed constellations), refreshed every hour by .github/workflows/orbits.yml. Read by the Taxi Antispoof app."
          gh release upload orbits out/* --clobber
          keep=$(ls out | paste -sd'|')
          gh release view orbits --json assets -q '.assets[].name' | grep -Ev "^(${keep})$" | while read -r a; do
            gh release delete-asset orbits "$a" -y && echo "deleted $a"
          done
